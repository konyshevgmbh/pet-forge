name: Validate

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: routes/apng/tools/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci --prefix routes/apng/tools
      - run: python -m pip install Pillow numpy
      - run: npm test --prefix routes/apng/tools
      - run: python routes/apng/tools/test_image_safety.py
      - run: python -m compileall -q routes
