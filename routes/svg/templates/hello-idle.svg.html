<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>pet-forge · hello-idle</title>
<style>
  /*
    pet-forge SVG route hello-world idle template
    ─────────────────────────────────────────
    A placeholder ball that breathes + blinks, proving the skill's workflow works end to end.
    This is a starting point, not a finished product. The user should replace the shape
    inside #pet with their own character, then tune the CSS variables in :root to fit
    their own pacing.

    Self-contained: inline SVG + CSS + JS, zero external dependencies. Double-click and it runs.
  */

  :root {
    /* Pacing tiers for the apple-precise preset (see routes/svg/presets/apple-precise.md) */
    --breath-period: 4.8s;       /* breathing period: 4-8s slow cycle */
    --breath-min: 0.97;          /* breathing minimum scale */
    --breath-max: 1.02;          /* breathing maximum scale (5-10% subtle amplitude) */

    --blink-min-gap: 3000;       /* minimum blink interval, ms */
    --blink-max-gap: 7000;       /* maximum blink interval, ms */
    --blink-duration: 150;       /* duration of a single blink, ms */

    /* Visual anchors: the user should change these colors to fit their character */
    --pet-fill: #F5F6FA;
    --pet-stroke: #B8C0CC;
    --eye-color: #5B6BCB;
    --bg: #FAFBFD;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, system-ui, sans-serif;
  }

  #stage {
    width: 320px;
    height: 320px;
    display: block;
  }

  /* Breathing: a whole-body scale loop.
     Pivot at the center. transform-origin is the key thing here — get it wrong
     and the whole thing will drift. */
  #pet {
    transform-origin: 100px 100px;
    animation: breathe var(--breath-period) ease-in-out infinite;
  }

  @keyframes breathe {
    0%   { transform: scale(var(--breath-min)); }
    50%  { transform: scale(var(--breath-max)); }
    100% { transform: scale(var(--breath-min)); }
  }

  /* Blinking: a scaleY squash.
     Toggled via a CSS class, triggered by JS at a random interval.
     The pivot is anchored at the eye's center, to avoid positional drift when it squashes. */
  .eye {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.075s ease-out;
  }
  .eye.blink {
    transform: scaleY(0.05);
  }

  /* Hint text at the top */
  #hint {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #99A;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div id="hint">pet-forge · hello-idle · replace the shape inside #pet to get started</div>

<svg id="stage" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!--
    The user's starting point: replace the content inside #pet with your own character's
    SVG (the output of the png2svg pipeline). Keep transform-origin at 100,100, and mark
    the eyes with the .eye class for blinking.
  -->
  <g id="pet">
    <!-- Main body: a simple circle -->
    <circle cx="100" cy="100" r="65"
            fill="var(--pet-fill)"
            stroke="var(--pet-stroke)" stroke-width="2.5"/>

    <!-- Both eyes: left / right -->
    <circle class="eye" cx="80" cy="95" r="6" fill="var(--eye-color)"/>
    <circle class="eye" cx="120" cy="95" r="6" fill="var(--eye-color)"/>
  </g>
</svg>

<script>
  /*
    Blink scheduling: a random interval + an occasional double-blink
    ───────────────────────────────
    A single blink = add .blink → wait `duration` → remove it
    Random interval = somewhere between blink-min-gap and blink-max-gap
    10% chance of a double-blink (more lively, avoids a regular-feeling loop)
  */
  const eyes = document.querySelectorAll('.eye');
  const root = getComputedStyle(document.documentElement);
  const minGap = parseInt(root.getPropertyValue('--blink-min-gap'));
  const maxGap = parseInt(root.getPropertyValue('--blink-max-gap'));
  const blinkMs = parseInt(root.getPropertyValue('--blink-duration'));

  function blinkOnce() {
    eyes.forEach(e => e.classList.add('blink'));
    setTimeout(() => eyes.forEach(e => e.classList.remove('blink')), blinkMs);
  }

  function scheduleNext() {
    const gap = minGap + Math.random() * (maxGap - minGap);
    setTimeout(() => {
      blinkOnce();
      // 10% chance of a double-blink
      if (Math.random() < 0.1) {
        setTimeout(blinkOnce, blinkMs + 120);
      }
      scheduleNext();
    }, gap);
  }

  scheduleNext();
</script>

</body>
</html>
